<title>Produtos Loja 01 Aristeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho compacto com a marca, faixa de status que também filtra, ferramentas, tabela que vira cartões no celular. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef2f7; --ink: #122033; --muted: #5a6a7f; --line: #dbe2eb;
  --brand: #10284f; --brand-ink: #ffffff; --accent: #e81820;
  --ok: #1d7446; --ok-bg: #dcf1e3; --eq: #8a5d00; --eq-bg: #fff0c2; --nc: #b42318; --nc-bg: #fce2de;
  --sf: #5a6a7f; --sf-bg: #e7ecf2; --check-a: #ffffff; --check-b: #e6ebf1;
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1420; --surface: #132033; --surface-2: #1a2a40; --ink: #e5ebf3; --muted: #9aa9bd; --line: #26364c;
  --brand: #8fb0ff; --brand-ink: #0c1420; --accent: #ff5a5f;
  --ok: #72d39c; --ok-bg: #133624; --eq: #f2c94c; --eq-bg: #3a2f0d; --nc: #ff8a80; --nc-bg: #43191a;
  --sf: #9aa9bd; --sf-bg: #1e2c40; --check-a: #1a2a40; --check-b: #223550; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1420; --surface: #132033; --surface-2: #1a2a40; --ink: #e5ebf3; --muted: #9aa9bd; --line: #26364c;
  --brand: #8fb0ff; --brand-ink: #0c1420; --accent: #ff5a5f;
  --ok: #72d39c; --ok-bg: #133624; --eq: #f2c94c; --eq-bg: #3a2f0d; --nc: #ff8a80; --nc-bg: #43191a;
  --sf: #9aa9bd; --sf-bg: #1e2c40; --check-a: #1a2a40; --check-b: #223550; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }

header.topo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { width: 92px; height: auto; background: #fff; border-radius: 10px; padding: 6px 8px; }
.topo h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.4rem, 3.4vw, 2rem); margin: 0; letter-spacing: -0.01em; color: var(--brand); text-wrap: balance; }
.topo p { margin: 2px 0 0; color: var(--muted); }
.topo .txt { min-width: 0; flex: 1 1 280px; }

.faixa { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chip-f { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; font: inherit; }
.chip-f b { font-family: var(--f-display); font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.chip-f span { font-size: .8rem; color: var(--muted); letter-spacing: .02em; }
.chip-f[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.chip-f .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.chip-f:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, tr:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.ferr { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ferr input, .ferr select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.ferr input { flex: 1 1 260px; }
.ferr select { flex: 0 1 220px; }
.conta { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

.tabela { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--brand); color: var(--brand-ink); font-family: var(--f-display); font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; text-align: left; padding: 10px 10px; z-index: 1; }
tbody tr { border-top: 1px solid var(--line); cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td { padding: 8px 10px; vertical-align: middle; }
.foto { width: 64px; height: 64px; border-radius: 10px; display: grid; place-items: center; overflow: hidden;
  background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 12px 12px; }
.foto img { width: 100%; height: 100%; object-fit: contain; }
.foto.vazia { background: var(--surface-2); border: 1px dashed var(--line); color: var(--muted); font-size: .68rem; text-align: center; line-height: 1.1; }
.cod { font-family: var(--f-mono); font-weight: 500; font-size: .9rem; white-space: nowrap; }
.desc { font-weight: 600; }
.cat { color: var(--muted); font-size: .82rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--f-mono); font-size: .82rem; word-break: break-word; }
.st { display: inline-block; font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.st.ok { color: var(--ok); background: var(--ok-bg); } .st.eq { color: var(--eq); background: var(--eq-bg); }
.st.nc { color: var(--nc); background: var(--nc-bg); } .st.sf { color: var(--sf); background: var(--sf-bg); }
.dot.ok { background: var(--ok); } .dot.eq { background: var(--eq); } .dot.nc { background: var(--nc); } .dot.sf { background: var(--sf); } .dot.tt { background: var(--brand); }
.div { color: var(--nc); font-weight: 600; font-size: .82rem; white-space: nowrap; }
.mais { display: flex; justify-content: center; }
.btn { font: inherit; font-weight: 600; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
.vazio { padding: 28px; text-align: center; color: var(--muted); }

dialog { border: 0; border-radius: 16px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(8 14 24 / .6); }
.dlg { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; padding: 20px; }
.dlg .big { aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
  background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px; }
.dlg .big img { width: 100%; height: 100%; object-fit: contain; }
.dlg h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; margin: 6px 0 10px; text-wrap: balance; }
.dlg dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0 0 12px; font-size: .9rem; }
.dlg dt { color: var(--muted); } .dlg dd { margin: 0; min-width: 0; word-break: break-word; }
.dlg h3 { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.dlg ul { margin: 0; padding-left: 18px; font-size: .9rem; }
.dlg .fechar { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 10px 10px 0; background: var(--surface); }
.dlg-corpo { min-width: 0; }
.transp { font-size: .78rem; color: var(--muted); margin-top: 6px; }

@media (max-width: 760px) {
  .faixa { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .faixa .chip-f:first-child { grid-column: 1 / -1; }
  thead { display: none; }
  table, tbody { display: block; }
  tbody tr { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; padding: 10px 12px; }
  tbody td { padding: 0; }
  td.c-foto { grid-column: 1; grid-row: 1 / span 3; }
  tbody td:not(.c-foto) { grid-column: 2; }
  td.c-ref, td.c-marca, td.c-saldo { display: inline; }
  .linha-extra { color: var(--muted); font-size: .85rem; }
  td.c-ref::before { content: "Ref. "; color: var(--muted); } td.c-marca::before { content: "Marca "; color: var(--muted); }
  td.c-saldo::before { content: "Saldo "; color: var(--muted); } td.c-saldo { text-align: left; }
  .dlg { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { tbody tr { transition: background-color .12s; } }
</style>

<div class="wrap">
  <header class="topo">
    <img class="logo" src="__LOGO__" alt="Aristeu Refrigeração">
    <div class="txt">
      <h1>Produtos da Loja 01 com fotos</h1>
      <p>Lista do sistema cruzada com as fotos tratadas do catálogo. Toque em um produto para ver a foto grande e os detalhes.</p>
    </div>
  </header>

  <div class="faixa" id="faixa" role="group" aria-label="Filtrar por situação da foto"></div>

  <div class="ferr">
    <input id="busca" type="search" placeholder="Buscar por código, descrição, referência ou marca" aria-label="Buscar">
    <select id="categoria" aria-label="Categoria"></select>
    <select id="ordem" aria-label="Ordenar">
      <option value="status">Com foto primeiro</option>
      <option value="saldo">Maior saldo</option>
      <option value="codigo">Código</option>
      <option value="descricao">Descrição A–Z</option>
    </select>
    <span class="conta" id="conta"></span>
  </div>

  <div class="tabela">
    <table>
      <thead><tr><th>Foto</th><th>Código</th><th>Descrição</th><th>Referência</th><th>Marca</th><th class="num">Saldo</th><th>Situação</th><th>Conferir</th></tr></thead>
      <tbody id="linhas"></tbody>
    </table>
    <div class="vazio" id="vazio" hidden>Nenhum produto encontrado com esses filtros.</div>
  </div>
  <div class="mais"><button class="btn" id="mais" type="button">Mostrar mais</button></div>
</div>

<dialog id="dlg" aria-labelledby="dlg-titulo">
  <div class="fechar"><button class="btn" id="fechar" type="button">Fechar</button></div>
  <div class="dlg" id="dlg-conteudo"></div>
</dialog>

<script id="dados" type="application/json">__DADOS__</script>
<script id="imagens" type="application/json">__IMAGENS__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("dados").textContent);
  const IMG = JSON.parse(document.getElementById("imagens").textContent);
  const ROT = { ok: "Com foto", eq: "Foto equivalente", nc: "Foto não confere", sf: "Sem foto" };
  const ORD_ST = { ok: 0, eq: 1, nc: 2, sf: 3 };
  const PASSO = 80;
  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = n => n == null ? "" : Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
  D.forEach(p => { p._t = norm([p.c, p.d, p.r, p.m].join(" ")); });

  let filtroSt = "tt", mostrar = PASSO;
  const $ = id => document.getElementById(id);

  // faixa de status (também filtra)
  const cont = { tt: D.length, ok: 0, eq: 0, nc: 0, sf: 0 };
  D.forEach(p => cont[p.s]++);
  const chips = [["tt", "Todos os produtos"], ["ok", ROT.ok], ["eq", ROT.eq], ["nc", ROT.nc], ["sf", ROT.sf]];
  $("faixa").innerHTML = chips.map(([k, t]) =>
    `<button type="button" class="chip-f" data-st="${k}" aria-pressed="${k === "tt"}"><b>${cont[k].toLocaleString("pt-BR")}</b><span><i class="dot ${k}"></i>${t}</span></button>`).join("");
  $("faixa").addEventListener("click", e => {
    const b = e.target.closest(".chip-f"); if (!b) return;
    filtroSt = b.dataset.st; mostrar = PASSO;
    document.querySelectorAll(".chip-f").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });

  const cats = [...new Set(D.map(p => p.k))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  $("categoria").innerHTML = `<option value="">Todas as categorias</option>` + cats.map(c => `<option>${esc(c)}</option>`).join("");

  function lista() {
    const q = norm($("busca").value).trim().split(/\s+/).filter(Boolean);
    const cat = $("categoria").value, ord = $("ordem").value;
    let r = D.filter(p => (filtroSt === "tt" || p.s === filtroSt) && (!cat || p.k === cat) && q.every(t => p._t.includes(t)));
    const porDesc = (a, b) => a.d.localeCompare(b.d, "pt-BR", { numeric: true });
    if (ord === "status") r.sort((a, b) => ORD_ST[a.s] - ORD_ST[b.s] || a.k.localeCompare(b.k, "pt-BR") || porDesc(a, b));
    else if (ord === "saldo") r.sort((a, b) => (b.q || 0) - (a.q || 0));
    else if (ord === "codigo") r.sort((a, b) => a.c.localeCompare(b.c));
    else r.sort(porDesc);
    return r;
  }

  function fotoHtml(p) {
    return p.i ? `<div class="foto"><img loading="lazy" src="${IMG[p.i]}" alt=""></div>` : `<div class="foto vazia">sem<br>foto</div>`;
  }

  let atual = [];
  function render() {
    atual = lista();
    const vis = atual.slice(0, mostrar);
    $("linhas").innerHTML = vis.map((p, i) => `
      <tr tabindex="0" data-i="${i}">
        <td class="c-foto">${fotoHtml(p)}</td>
        <td class="cod">${esc(p.c)}</td>
        <td><div class="desc">${esc(p.d)}</div><div class="cat">${esc(p.k)}</div></td>
        <td class="c-ref mono linha-extra">${esc(p.r) || "—"}</td>
        <td class="c-marca linha-extra">${esc(p.m) || "—"}</td>
        <td class="c-saldo num linha-extra">${fmt(p.q)}</td>
        <td><span class="st ${p.s}">${ROT[p.s]}</span></td>
        <td>${p.v.length ? `<span class="div">${p.v.length} ${p.v.length > 1 ? "pontos" : "ponto"}</span>` : ""}</td>
      </tr>`).join("");
    $("vazio").hidden = atual.length > 0;
    $("mais").hidden = mostrar >= atual.length;
    $("mais").textContent = `Mostrar mais ${Math.min(PASSO, atual.length - mostrar).toLocaleString("pt-BR")}`;
    $("conta").textContent = `${atual.length.toLocaleString("pt-BR")} produtos` + (atual.length > vis.length ? ` · exibindo ${vis.length.toLocaleString("pt-BR")}` : "");
  }

  function abrir(p) {
    const itens = (arr) => arr.map(([t, a]) => `<li><b>${esc(t)}:</b> ${esc(a)}</li>`).join("");
    $("dlg-conteudo").innerHTML = `
      <div>
        <div class="big">${p.i ? `<img src="${IMG[p.i]}" alt="${esc(p.d)}">` : `<span class="transp">Sem foto</span>`}</div>
        ${p.i ? `<p class="transp">O quadriculado indica o fundo transparente do PNG.</p>` : ""}
      </div>
      <div class="dlg-corpo">
        <span class="st ${p.s}">${ROT[p.s]}</span>
        <h2 id="dlg-titulo">${esc(p.d)}</h2>
        <dl>
          <dt>Código</dt><dd class="cod">${esc(p.c)}</dd>
          <dt>Referência</dt><dd class="mono">${esc(p.r) || "—"}</dd>
          <dt>Marca</dt><dd>${esc(p.m) || "—"}</dd>
          <dt>Saldo</dt><dd>${fmt(p.q)}</dd>
          <dt>Categoria</dt><dd>${esc(p.k)}</dd>
          ${p.a ? `<dt>Arquivo PNG</dt><dd class="mono">${esc(p.a)}</dd>` : ""}
          ${p.p ? `<dt>Post Instagram</dt><dd class="mono">${esc(p.p)}</dd>` : ""}
        </dl>
        ${p.f ? `<h3>Informações complementares</h3><p>${esc(p.f)}</p>` : ""}
        ${p.dc ? `<h3>Descrição no catálogo</h3><p>${esc(p.dc)}</p>` : ""}
        ${p.v.length ? `<h3>Conferir</h3><ul>${itens(p.v)}</ul>` : ""}
        ${p.n.length ? `<h3>Observações</h3><ul>${itens(p.n)}</ul>` : ""}
      </div>`;
    const d = $("dlg");
    if (typeof d.showModal === "function") d.showModal(); else d.setAttribute("open", "");
  }

  $("linhas").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) abrir(atual[+tr.dataset.i]); });
  $("linhas").addEventListener("keydown", e => { if (e.key === "Enter") { const tr = e.target.closest("tr"); if (tr) abrir(atual[+tr.dataset.i]); } });
  $("fechar").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
  $("mais").addEventListener("click", () => { mostrar += PASSO; render(); });
  let t; $("busca").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { mostrar = PASSO; render(); }, 150); });
  $("categoria").addEventListener("change", () => { mostrar = PASSO; render(); });
  $("ordem").addEventListener("change", () => { mostrar = PASSO; render(); });
  render();
})();
</script>
