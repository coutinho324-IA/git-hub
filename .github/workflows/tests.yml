name: Testes

# O site é publicado pelo próprio GitHub Pages a partir do branch main
# (Settings → Pages → Deploy from a branch → main → / (root)).
# Este workflow só roda os testes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
